<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- App squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Performance gauge arc -->
  <path d="M 30 84 A 40 40 0 1 1 98 84" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M 30 84 A 40 40 0 1 1 92 40" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round"/>

  <!-- Stylized laptop base -->
  <rect x="34" y="94" width="60" height="6" rx="3" fill="#94a3b8"/>
  <rect x="52" y="96" width="24" height="2" rx="1" fill="#0f172a"/>

  <!-- Power bolt -->
  <polygon points="68,36 47,65 61,65 55,86 80,55 65,55" fill="url(#bolt)"/>
</svg>
