[package]
name = "laptop-tune"
version = "2.7.3"
edition = "2021"
description = "Unified Linux laptop power, hybrid GPU runtime PM, thermal, and battery threshold auditor & configurator."
license = "MIT"
repository = "https://github.com/HmFlashy/laptop-tune"
homepage = "https://github.com/HmFlashy/laptop-tune"
readme = "README.md"
keywords = ["linux", "laptop", "power", "gpu", "battery"]
categories = ["command-line-utilities", "gui", "hardware-support", "os::linux-apis"]
exclude = ["docs/assets/*"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
ksni = { version = "0.3", features = ["blocking"] }

[[bin]]
name = "laptop-tune"
path = "src/main.rs"
